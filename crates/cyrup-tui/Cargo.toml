[package]
name = "cyrup-tui"
description = "ratatui + crossterm front-end (arch-10; binds ADR-0001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# ON by default, matching cyrup-ext and cyrup-session-svc. The feature exists so
# `tests/wasm_renderer_screen.rs` — the EXT-006 end-to-end that draws a LIVE WASM guest's serialized
# widget tree onto real terminal cells — can `#![cfg(feature = "wasm-host")]` itself out instead of
# failing to compile.
#
# Turning it OFF does NOT produce a wasmtime-free build of this crate and must not be described as
# one. No `cfg` in `src/` reads it, and `src/app/mod.rs:111` names `cyrup_ext::host::HostServices`
# unconditionally, so `src/` cannot compile without the host at all; `cyrup-ext` is therefore pulled
# in below with `features = ["wasm-host"]`. EXT-026 (`docs/gap-analysis/06-cyrup-ext.md:263`) is the
# ledger item for a genuinely native-only graph, not this flag.
default = ["wasm-host", "scrolling-regions"]
wasm-host = ["cyrup-ext/wasm-host", "cyrup-session-svc/wasm-host"]
# Retains every committed line in `AppState::scrollback` for test/inspection assertions. OFF in
# production: the accumulator costs memory ∝ total session output and is never read outside tests
# (TUI-092 F1). In-crate `#[cfg(test)]` code needs no feature; this exists for the two
# integration-style consumers whose own `cfg(test)` does not reach the `cyrup-tui` lib build:
# `tests/zzz_scratch_perf_probe.rs` (self-gated) and `cyrup-it`'s `tests/bin/wasm_renderer_screen.rs`
# (via the dev-dependency edge).
scrollback-accumulator = []
# Passthrough for ratatui's DECSTBM `insert_before` (TUI-092-F5). ON by default: no terminal in
# cyrup's supported matrix lacks DECSTBM, and this retires ratatui's own documented tmux
# clear+scroll garbage hazard rather than introducing one. Flipping it also compiles
# `InlineBackend`'s two `scroll_region_*` delegations (`app/backend.rs`), which are already written
# behind this same feature so the F5 flip stays the one-line change its own doc promises.
scrolling-regions = ["ratatui/scrolling-regions"]

[dependencies]
cyrup-core = { workspace = true }
cyrup-session-svc = { workspace = true }
cyrup-resources = { workspace = true }
# Already a transitive dep (via cyrup-session-svc) and a dev-dep below; promoted to a direct dependency
# so the `HostServices` trait (`cyrup_ext::host`) is in scope to call `LiveHostServices::set_label` —
# the live label-append the `/tree` `e` rename persists through (the SAME seam a guest's `setLabel`
# uses, host_services.rs:866). `LiveHostServices` exposes the append only via that trait impl.
#
# `cyrup_ext::host` exists only under `wasm-host` (`cyrup-ext/src/lib.rs:147-152`) and
# `src/app/mod.rs:111` imports it with no `cfg`.
# `wasm-host` is NOT optional for this crate, and until now no manifest said so: the feature rode in
# on `cyrup-ext`'s `default = ["wasm-host"]` through the workspace table, which sets no
# `default-features = false` (root `Cargo.toml:111`). Stating it on the edge changes the resolved
# graph in exactly zero builds — measured, not assumed: the feature is already on in every
# configuration this workspace can currently produce, `--workspace --no-default-features` included,
# because there each member's defaults come straight back through its siblings' edges. What the edge
# buys is that the requirement SURVIVES the day `cyrup-ext` stops defaulting `wasm-host` on, or any
# edge here gains `default-features = false` — either of which would otherwise turn this crate into a
# wall of `E0432`/`E0407` with nothing in any manifest saying why. This is NOT the PROV-052 shape:
# `wasm-host` is the production capability host, not a test double.
cyrup-ext = { workspace = true, features = ["wasm-host"] }
# Already a transitive dep (via cyrup-session-svc) and a dev-dep below; promoted to a direct
# dependency so the streaming-delta variants of `StreamEvent` (`TextDelta { delta, partial }`,
# stream.rs:306) can be matched in `App::ingest_event` (gap 1 — live token-by-token render).
cyrup-provider = { workspace = true }
# Already a transitive dep (via cyrup-session-svc); promoted to a direct dependency so `/login` can
# run the REAL ported flow: `cyrup_config::login::{login, logout, login_provider_options,
# resolve_login_command, start_provider_login, resolve_auth_type_selector}` is the config-side half
# of Pi's `handleLoginCommand` (`interactive-mode.ts:4994-5051`) and `Models.login`
# (`ai/src/models.ts:431-452`). Points downward: cyrup-config sits below cyrup-session-svc, which
# already re-exports the `AuthStore` this crate writes through.
cyrup-config = { workspace = true }
# The `AuthInteraction` trait (`cyrup_provider::auth::oauth`) is `#[async_trait]`, so implementing it
# for the TUI (`login_dialog::TuiAuthInteraction`) needs the attribute at the definition site. Was a
# dev-dependency only (the EXT-006 `NativeExtension` test); promoted for that impl.
async-trait = { workspace = true }
thiserror = { workspace = true }
# `unstable-rendered-line-info` exposes `Paragraph::line_count(width)` — used to measure the WRAPPED
# display-row height of prose so the content-sized viewport + scrollback flush match what render wraps
# (fixes the single-long-paragraph PROSE-WRAP truncation; spec/tui/01 §3 overflow).
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true
# Rich rendering (spec/tui/06): markdown parse + syntax highlight. Both pure-Rust.
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
# Inline images (spec/tui/06 §6; tui/src/terminal-image.ts): Kitty/iTerm2/sixel via `ratatui-image`,
# with a half-block fallback that renders to ANY backend (incl. `TestBackend`) and a text placeholder
# under the `show_images` toggle. `image` decodes/resizes the source bytes (already in-workspace).
ratatui-image = { workspace = true }
image = { workspace = true }
# TUI-004 — the OSC 11 / DSR `?996` terminal probes (`terminal_query.rs`). Reading the reply needs a
# `poll(2)`-bounded read straight off the stdin fd: crossterm has no OSC/DSR event and its `poll`
# would swallow the bytes into its own parser, while any blocking-read design would either hang on a
# silent terminal or steal the user's first keystroke. `rustix` is the safe, pure-Rust (linux_raw,
# no C) wrapper for that pair, so `#![forbid(unsafe_code)]` here is unaffected.
rustix = { workspace = true }
# Tool-result `image` content blocks arrive base64-encoded on the wire (`Content::Image { data }`,
# cyrup-core `message.rs:220`), so the transcript decodes them before handing the bytes to `image`
# (Pi's `ToolExecutionComponent` passes the same base64 straight to its `Image` component,
# tool-execution.ts:342-349).
base64 = { workspace = true }
# Clipboard IMAGE paste (gap-12 F5; Ctrl+V — `handleClipboardImagePaste`, interactive-mode.ts:2537-2557
# + `utils/clipboard-image.ts`/`clipboard-native.ts`). `arboard` reads a native-clipboard image
# (NSPasteboard on macOS, X11/Wayland on Linux) — the faithful Rust analog of Pi's native clipboard
# module, not a substituted design. The RGBA raster is re-encoded to a PNG temp file via the `image`
# crate above; `uuid` names it `cyrup-clipboard-<uuid>.png` (Pi's `pi-clipboard-<randomUUID>.<ext>`).
arboard = { workspace = true }
uuid = { workspace = true }
# Grapheme-cluster cursor motion (spec/tui/03 §4; editor-component.ts grapheme stepping) — user-approved.
unicode-segmentation = { workspace = true }
# JSON keybindings loader (spec/tui/07 §3.9; core/keybindings.ts:14-262) + theme-data hot-reload.
serde_json = { workspace = true }
# Already a transitive dep (via cyrup-session-svc) and previously a dev-dep only; promoted to a
# direct dependency for `edit`'s PRE-EXECUTION diff preview (Pi `computeEditsDiff`,
# edit-diff.ts:514-547, fired from `renderCall` at edit.ts:377-386). `ingest_event_rendered_owned`
# calls `cyrup_tools::tools::edit_diff::compute_edits_diff` on `ToolExecutionStart` so the diff is
# rendered before the write lands — the preview MUST share the tool's own matching core, or it
# would show a diff the tool then contradicts. Points downward: cyrup-tools sits below cyrup-tui.
cyrup-tools = { workspace = true }

[dev-dependencies]
cyrup-provider = { workspace = true, features = ["faux"] }
# Dev-only: lets the streaming-delta render test build the `AgentMessage` carried by
# `AgentSessionEvent::MessageUpdate` (the runtime payload the TUI ignores but the variant requires).
cyrup-agent = { workspace = true }
# `DialogOptions` (the type of `UiRequest::opts`) lives in cyrup-ext (now a direct dependency above,
# where the `HostServices` trait for the `/tree` label-append is pulled in) and the
# extension-dialog-countdown test builds a synthetic `UiRequest` from it.
tempfile.workspace = true
# `async-trait` was listed here for EXT-006 (the renderer-routing test declares a `NativeExtension`)
# and for `tests/login_flow.rs`'s stub `OAuthAuth`/`ApiKeyAuth`; it is now a REGULAR dependency
# above (the `AuthInteraction` impl needs it in `src/`), which covers dev builds too.
