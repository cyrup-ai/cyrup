[package]
name = "cyrup-tui"
description = "ratatui + crossterm front-end (arch-10; binds ADR-0001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
cyrup-core = { workspace = true }
cyrup-session-svc = { workspace = true }
cyrup-resources = { workspace = true }
# Already a transitive dep (via cyrup-session-svc) and a dev-dep below; promoted to a direct dependency
# so the `HostServices` trait (`cyrup_ext::host`) is in scope to call `LiveHostServices::set_label` —
# the live label-append the `/tree` `e` rename persists through (the SAME seam a guest's `setLabel`
# uses, host_services.rs:866). `LiveHostServices` exposes the append only via that trait impl.
cyrup-ext = { workspace = true }
# Already a transitive dep (via cyrup-session-svc) and a dev-dep below; promoted to a direct
# dependency so the streaming-delta variants of `StreamEvent` (`TextDelta { delta, partial }`,
# stream.rs:306) can be matched in `App::ingest_event` (gap 1 — live token-by-token render).
cyrup-provider = { workspace = true }
thiserror = { workspace = true }
# `unstable-rendered-line-info` exposes `Paragraph::line_count(width)` — used to measure the WRAPPED
# display-row height of prose so the content-sized viewport + scrollback flush match what render wraps
# (fixes the single-long-paragraph PROSE-WRAP truncation; spec/tui/01 §3 overflow).
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true
# Rich rendering (spec/tui/06): markdown parse + syntax highlight. Both pure-Rust.
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
# Inline images (spec/tui/06 §6; tui/src/terminal-image.ts): Kitty/iTerm2/sixel via `ratatui-image`,
# with a half-block fallback that renders to ANY backend (incl. `TestBackend`) and a text placeholder
# under the `show_images` toggle. `image` decodes/resizes the source bytes (already in-workspace).
ratatui-image = { workspace = true }
image = { workspace = true }
# Clipboard IMAGE paste (gap-12 F5; Ctrl+V — `handleClipboardImagePaste`, interactive-mode.ts:2537-2557
# + `utils/clipboard-image.ts`/`clipboard-native.ts`). `arboard` reads a native-clipboard image
# (NSPasteboard on macOS, X11/Wayland on Linux) — the faithful Rust analog of Pi's native clipboard
# module, not a substituted design. The RGBA raster is re-encoded to a PNG temp file via the `image`
# crate above; `uuid` names it `cyrup-clipboard-<uuid>.png` (Pi's `pi-clipboard-<randomUUID>.<ext>`).
arboard = { workspace = true }
uuid = { workspace = true }
# Grapheme-cluster cursor motion (spec/tui/03 §4; editor-component.ts grapheme stepping) — user-approved.
unicode-segmentation = { workspace = true }
# JSON keybindings loader (spec/tui/07 §3.9; core/keybindings.ts:14-262) + theme-data hot-reload.
serde_json = { workspace = true }

[dev-dependencies]
cyrup-provider = { workspace = true, features = ["faux"] }
# Dev-only: lets the streaming-delta render test build the `AgentMessage` carried by
# `AgentSessionEvent::MessageUpdate` (the runtime payload the TUI ignores but the variant requires).
cyrup-agent = { workspace = true }
# `DialogOptions` (the type of `UiRequest::opts`) lives in cyrup-ext (now a direct dependency above,
# where the `HostServices` trait for the `/tree` label-append is pulled in) and the
# extension-dialog-countdown test builds a synthetic `UiRequest` from it.
tempfile.workspace = true
