[package]
name = "cyrup-flux"
description = "Flux: structured, file-persisted AI development pipeline (native cyrup-ext extension; port of code-puppy flux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# The bundled prompt/skill tree is shipped content, not build input — `cargo package` drops it
# unless it is named. Declaring `include` makes it the WHOLE manifest, hence the explicit
# src/Cargo.toml entries alongside it (the `cyrup-permission-system/Cargo.toml:14-20` pattern).
include = [
    "src/**/*.rs",
    "resources/**",
    "Cargo.toml",
    "build.rs",
]

[lints]
workspace = true

[dependencies]
# NB: no `default-features = false` — `HostServices`, `InteractiveOverlay` and the overlay
# value types are `wasm-host`-gated re-exports (cyrup-ext/src/lib.rs:199-207) that FLUX_09 and
# FLUX_10 require.
cyrup-core = { workspace = true }
cyrup-ext = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# FLUX_10's `ask_user_question` hops the blocking `HostServices::select` call off the async
# executor with `spawn_blocking`.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
# FLUX-001 — the installer port (`flux_bootstrap/installer.py` @v0.0.40) tells "user hand-edited it"
# from "we wrote it last time" by a manifest of SHA-256 hashes (`:75-80`, `:139-149`), and takes a
# best-effort exclusive `flock` on `.flux_bootstrap.lock` (`:247-256`). Both crates are already in
# the lock at these versions (`cyrup-intercom` / `cyrup-config`).
sha2 = { workspace = true }
fs4 = "1.1.0"

[dev-dependencies]
tempfile = { workspace = true }
# FLUX-004 — `tests/flux_004_status_shortcut.rs` runs the status-overlay chord through the TUI's
# REAL default keymaps (`Keymap`, `EditorKeymap`, …) rather than a copied key list, so a chord that
# collides with a built-in binding fails here instead of silently stealing the key at run time.
# Test-side only: the production crate never depends on a terminal owner (the same crate-boundary
# rule `cyrup-ext-subagents/Cargo.toml` states for its `ratatui` dependency).
cyrup-tui = { workspace = true }
