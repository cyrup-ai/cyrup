[package]
name = "cyrup-session"
description = "JSONL session tree, compaction, system-prompt/context assembly (arch-04/05/06)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = "1.9.1"
cyrup-config.workspace = true
# arch-04 (SESSIONS & BRANCHING) needs only cyrup-core + serde/time/uuid. cyrup-config and
# cyrup-resources (which transitively pull cyrup-provider) are deferred to arch-05/06 and are
# intentionally NOT depended on here so this layer builds in isolation.
cyrup-core = { workspace = true }
cyrup-provider.workspace = true
cyrup-resources.workspace = true
futures.workspace = true
rustc-hash = "2.1.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio.workspace = true
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Lock-neutral: cyrup-provider is already a dependency; the `faux` feature pulls no new crate.
cyrup-provider = { workspace = true, features = ["faux"] }
