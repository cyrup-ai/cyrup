[package]
name = "cyrup-sdk"
description = "Public embeddable API: re-exports the AgentSession facade + service factories (arch-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
cyrup-core = { workspace = true }
cyrup-session-svc = { workspace = true }
cyrup-modes = { workspace = true }
cyrup-agent = { workspace = true }
cyrup-provider = { workspace = true }
cyrup-session = { workspace = true }
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
cyrup-provider = { workspace = true, features = ["faux"] }
# SEAM-026: the SDK lifecycle tests register a recording NATIVE extension to observe the
# `session_start` / `session_shutdown` an embedder's extensions must receive. Test-only — the SDK
# itself reaches extensions through `cyrup-session-svc`'s re-exported builder seam.
cyrup-ext = { workspace = true }
tempfile.workspace = true
