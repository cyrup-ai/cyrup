[package]
name = "cyrup-permission-system"
description = "Permission system: allow/ask/deny policy gate over tool calls (native cyrup-ext extension; port of pi-permission-system)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# PERM-029 — the two shipped, non-Rust artifacts, declared so `cargo package` carries them exactly
# as upstream declares them in `package.json:14-15` (`"config/config.example.json"`,
# `"schemas/permissions.schema.json"`). Listing `include` at all means it is now the WHOLE manifest
# of what ships, hence the explicit `src`/`Cargo.toml`/licence entries.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "schemas/cyrup-permissions.schema.json",
    "config/config.example.json",
]

[lints]
workspace = true

[dependencies]
cyrup-core = { workspace = true }
cyrup-ext = { workspace = true }
# P-5 (port doc §4 / reconciliation §2): the child→parent ask-forwarding spool (`forwarding.rs`)
# consumes the `cyrup-ext-subagents::background::control` file-channel primitives as BUILDING BLOCKS —
# `validate_safe_token`/`validate_contains_root` (safe path-token guard before any `Path::join`),
# `CONTROL_INBOX_POLL_INTERVAL` (the poll cadence) — AND the R-SA-P1 parent-session anchor const
# `PARENT_SESSION_ENV_VAR` (`CYRUP_SUBAGENT_PARENT_SESSION`), the routing key a child reads to address
# its parent's inbox. The spool MECHANISM itself (nonce-bound request/response message shapes, the
# `wx`/0o600 atomic write, the 0o700 session dirs, the directory layout) is pi's OWN, replicated here
# (`permission-forwarding.ts` + `index.ts:1030-1504`), NOT the subagents interrupt channel.
cyrup-ext-subagents = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# The child forwarding wait (`forwarding::wait_for_forwarded_approval`) is an async poll loop awaited
# under a `HostCtx::begin_human_wait` P-3 guard; the parent forwarding WATCHER is a spawned `tokio`
# task the parent session installs on `SessionStart` (running OUTSIDE any live `HostCtx`, reachable via
# the captured `HostServices` Arc). Both need the async runtime + timers + the `fs` bridge.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
# The parent watcher's request-inbox directory watch (pi's `fs.watch` + 2s poll, `index.ts:909-953,
# 1904-2031`): a `notify::PollWatcher` mirroring `control.rs`'s `watch_control_inbox` pattern, polling
# at `CONTROL_INBOX_POLL_INTERVAL`.
notify = { workspace = true }
# Forwarding message identity + at-most-once request creation (pi `randomUUID()`, `index.ts:1167,1282`):
# the request id + the per-write `<path>.<pid>.<uuid>.tmp` temp-file name.
uuid = { workspace = true, features = ["v4"] }
# The 256-bit response nonce (pi `randomBytes(32).toString("base64url")`, `index.ts:1135-1137`):
# `getrandom` fills 32 CSPRNG bytes; `base64` URL-safe-no-pad encodes them (matches Node `base64url`).
getrandom = "0.3"
base64 = { workspace = true }
# The wildcard compiler (`wildcard.rs`, pi `wildcard-matcher.ts:13-27`) needs the dotAll (`s`) flag —
# `RegexBuilder::dot_matches_new_line(true)` — so multi-line bash/heredoc commands are matched by
# `.*` across newlines (the load-bearing fix pi's `wildcard-multiline.test.ts`/Issue #24 verifies).
# `regex` is already resolved in the workspace lock transitively (ignore/globset/grep-regex); this
# promotes it to a direct dependency.
regex = "1"
# SHA-256 for the permission-prompt dedup fingerprint (`dedup.rs`, pi `index.ts:735`
# `createHash("sha256").update(fingerprint).digest("hex")`). Same version `cyrup-ext-subagents`
# already pins directly (0.11.0); no new workspace-wide version surface.
sha2 = "0.11.0"
# The audit/debug JSONL trail's `timestamp` field (`logging.rs`, pi `logging.ts:72`
# `new Date().toISOString()`): UTC wall-clock formatted to millisecond precision. `std::time` has no
# calendar, and the workspace already resolves `time` (cyrup-session, cyrup-session-svc) with the
# `formatting` feature, so this adds no new version surface.
time = { workspace = true }
# Bash command-unit enumeration (`bash/`, pi `access-intent/bash/command-enumeration.ts`). Upstream
# pins `tree-sitter-bash: ^0.25.1`; 0.25.1 here is the same grammar generation, so the node-type
# names (`command`, `command_substitution`, `heredoc_body`, …) transfer 1:1. Native grammar, so the
# parse is synchronous — pi's async WASM warm-up (`parser.ts:62-78`) has no analogue here.
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"

[dev-dependencies]
# NOTE (2026-08): the four integration binaries this section used to name — `tests/gate_integration.rs`,
# `tests/human_dialog.rs`, `tests/forwarding_subprocess.rs`, `tests/layers_wired.rs` — no longer live
# in this crate. They are modules of the workspace's one seam-test crate:
# `crates/cyrup-it/tests/permission/{gate_integration,human_dialog,forwarding_subprocess,layers_wired}.rs`,
# wired at `crates/cyrup-it/tests/permission/main.rs:52-61`, which carries its own dev edges for them
# (`cyrup-test-support`, `cyrup-provider` with `features = ["faux"]`, `cyrup-session-svc`,
# `cyrup-config`, `cyrup-ext`, `cyrup-core`, `cyrup-permission-system`). The `cyrup-test-support`,
# `cyrup-provider`, `cyrup-session-svc` and `cyrup-config` edges that used to sit here were therefore
# dead — zero references from this crate's `src/` or `tests/` — and are removed.
# What remains in THIS crate is `tests/shipped_artifacts.rs` plus the `#[cfg(test)]` modules under
# `src/`, and this section must describe only those.
#
# `cyrup-ext`, `cyrup-core`, `serde_json`, `tokio` and `async-trait` below are RESTATEMENTS of entries
# already in `[dependencies]`; they add no compile surface and no feature (`cyrup-ext`'s `wasm-host` is
# default-on and is required by non-test `src/config_modal.rs` anyway, and the `tokio` feature set here
# is a subset of the normal edge's). They are kept only so a future trim of `[dependencies]` cannot
# silently break `cfg(test)`.
cyrup-ext = { workspace = true, features = ["wasm-host"] }
cyrup-core = { workspace = true }
# `tests/shipped_artifacts.rs` + the `#[cfg(test)]` modules in `src/ext_config.rs`, `src/logging.rs`,
# `src/sanitize/skills.rs` and the `src/tests/` + `src/extension/tests/` trees. Dev-only for real.
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = { workspace = true }
# TEST-ONLY oracle for `manager.rs::built_in_tool_names_tracks_the_tool_registry`. `BUILT_IN_TOOL_NAMES`
# is Pi's `permission-manager.ts` constant (which permission KEYS are built-in-tool keys), NOT a
# mirror of the registry (which tools are INSTALLED, in wire order) — the two answer different
# questions and must stay separately stated, so this is deliberately a dev edge and `manager.rs`
# never names `cyrup_tools`. The test is what makes the sets provably equal. No new compile surface:
# `cyrup-tools` is already normal-reachable through `cyrup-ext`, with the same default
# `inline-images` feature.
cyrup-tools = { workspace = true }
