[package]
name = "cyrup-resources"
description = "Skills, prompt templates, themes, packages (arch-09)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
# `cyrup_config::paths::normalize_path` — the single port of Pi `normalizePath`
# (`coding-agent/src/utils/paths.ts:57-78`). Settings-declared resource paths and local package
# sources go through the identical function as the settings/env/CLI dir tiers, so `~/team-skills`
# cannot expand on one tier and stay literal on another (CFG-025). A second copy here is exactly
# the duplication that let cyrup's two `encode_cwd` implementations drift into the same bug.
cyrup-config = { workspace = true }
cyrup-core = { workspace = true }
gix = { version = "0.85.0", features = [
    "blocking-network-client",
    "blocking-http-transport-reqwest-rust-tls",
] }
globset.workspace = true
ignore.workspace = true
notify = "8.2.0"
serde.workspace = true
serde_json.workspace = true
serde_yml = "0.0.13"
thiserror = { workspace = true }
tokio.workspace = true
toml = "1.1.2"

[dev-dependencies]
tempfile = { workspace = true }
