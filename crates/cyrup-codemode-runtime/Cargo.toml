[package]
name = "cyrup-codemode-runtime"
description = "pi codemode, engine-bound half: the deno_core sandbox, the codemode tool and its script globals (gap-analysis 18)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `testkit`: a scripted `ScriptSandbox` and a recording `CodemodeHost`, so a consumer's tests can
# drive the `codemode` tool through its real seams without an engine. Never on in a release build.
testkit = []

[dependencies]
cyrup-core = { workspace = true }
cyrup-codemode = { workspace = true }
# `CodemodeMode`, the `codemode.mode` / `codemode.inlineBudget` settings the host reports.
cyrup-config = { workspace = true }
# `NativeExtension`/`InitApi`: the built-in extension that registers the tool.
cyrup-ext = { workspace = true }
# `AnyModel`, `ClassifierContext`, `ImagesContext` and `Models`: what the `models` globals call.
cyrup-provider = { workspace = true }
# `localeCompare` for the order of namespace headings (`createCodemodeDescription`).
feruca = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
# ADR-0031: the one JavaScript engine in this workspace. The sandbox embeds V8 through `deno_core`
# alone (no `deno_runtime`): ECMAScript intrinsics and this crate's ops, nothing else.
deno_core = { workspace = true }

# The sandbox process lowers its own `RLIMIT_DATA` and `RLIMIT_CORE` (`sandbox/child.rs`); nix's
# `setrlimit` is the safe spelling, which this crate's `forbid(unsafe_code)` needs. Compiles to an
# empty crate on Windows (ADR-0007), so the dependency is gated rather than the code.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource"] }

[dev-dependencies]
tempfile = { workspace = true }
# `Agent` and `ProviderStreamFn`: the grammar-sampling round trip drives a real agent turn through
# the real `openai-responses` adapter against a loopback server (`tool::grammar_tests`).
cyrup-agent = { workspace = true }
# A loopback `TcpListener` for that server; nothing here can reach a real network host.
tokio = { workspace = true, features = ["net"] }
# `BUILTIN_NAMES`, which `tool::description::BUILT_IN_TOOL_NAMES` restates (a drift test).
cyrup-tools = { workspace = true }
# Decodes the image a test finds in a saved file, to compare it with the one the script showed.
base64 = { workspace = true }
