[package]
name = "cyrup-codemode-runtime"
description = "pi codemode, engine-bound half: the deno_core sandbox, the codemode tool and its script globals (gap-analysis 18)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# `testkit`: a scripted `ScriptSandbox` and a recording `CodemodeHost`, so a consumer's tests can
# drive the `codemode` tool through its real seams without an engine. Never on in a release build.
testkit = []

[dependencies]
cyrup-core = { workspace = true }
cyrup-codemode = { workspace = true }
# `CodemodeMode`, the `codemode.mode` / `codemode.inlineBudget` settings the host reports.
cyrup-config = { workspace = true }
# `NativeExtension`/`InitApi`: the built-in extension that registers the tool.
cyrup-ext = { workspace = true }
# `AnyModel`, `ClassifierContext`, `ImagesContext` and `Models`: what the `models` globals call.
cyrup-provider = { workspace = true }
# `localeCompare` for the order of namespace headings (`createCodemodeDescription`).
feruca = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
# ADR-0031: the one JavaScript engine in this workspace. The sandbox embeds V8 through `deno_core`
# alone (no `deno_runtime`): ECMAScript intrinsics and this crate's ops, nothing else.
deno_core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
