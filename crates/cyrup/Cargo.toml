[package]
name = "cyrup"
description = "The cyrup CLI binary: arg parsing, mode selection, wiring (arch-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "cyrup"
path = "src/main.rs"

[lib]
name = "cyrup"
path = "src/lib.rs"

[features]
# PROV-052 — **TEST-ONLY, DEFAULT-OFF, and it must stay that way.**
#
# Makes `--model faux/…` / `--provider faux` selectable in the BINARY (`src/provider.rs`'s
# `#[cfg(feature = "faux")]` arm), which is what the five integration tests that spawn
# `CARGO_BIN_EXE_cyrup` and script a whole offline turn need (`one_shot_parity.rs`,
# `piped_stdin_trim.rs`, `unknown_flag_exit.rs`, `extension_load_failure_exit.rs`,
# `auth_credential_print.rs`). Upstream has no CLI-reachable faux at all — `packages/ai/src/providers/faux.ts`
# is absent from `providers/all.ts`, is not a `KnownProvider`, and has zero matches under
# `packages/coding-agent/src/` @v0.83.0 — so this is a test seam, not a ported behaviour.
#
# It is turned on for `cargo test` ONLY, by the self-dev-dependency in `[dev-dependencies]` below.
# NEVER add it to a `[dependencies]` edge or to `default`: Cargo unifies features additively, and
# doing so is precisely the defect PROV-052 records.
#
# **THIS feature — the `cyrup` package's own — is the gate that actually holds.** Not the placement
# of `cyrup-provider/faux` edges: `cyrup-test-support` enables that one on a NORMAL edge, so a
# `cargo build --workspace` compiles `cyrup_provider::faux` into the rlib this binary links. It is
# still unselectable there, because `src/provider.rs`'s `Some("faux")` arm is `#[cfg(feature =
# "faux")]` on the line below, and nothing normal turns the line below on.
#
# The secondary, default-member-graph invariant, checked both ways by
# `crates/cyrup-provider/tests/faux_not_in_normal_build.rs`:
#
#   cargo tree -p cyrup -e features --edges normal | grep faux   →   empty
#   cargo tree -p cyrup -e features             | grep faux   →   the dev edge only
faux = ["cyrup-provider/faux"]

[dependencies]
# Workspace seams (arch-11 §2.4): the SDK + facade + config + non-interactive adapters + TUI.
cyrup-sdk = { workspace = true }
cyrup-session-svc = { workspace = true }
cyrup-config = { workspace = true }
cyrup-modes = { workspace = true }
cyrup-tui = { workspace = true }
# SEAM-S03 — `signals.rs` drains the process-global detached-bash-child registry as the FIRST act of
# every shutdown handler, exactly as Pi's three handlers open with `killTrackedDetachedChildren()`
# (`utils/shell.ts:190-195` @v0.83.0). The registry has to live in `cyrup-tools` because the only two
# things that write it are `LocalProc::exec`'s spawn and its RAII drop, so this bin can only read it
# through a direct edge — it is already in the graph transitively (`cyrup-session-svc` depends on it),
# so this names the existing rlib rather than adding a build.
cyrup-tools = { workspace = true }
# The SubAgents extension (arch-SA): registered as a native built-in at all three session
# construction sites below, plus this bin owns the internal `__subagent-runner --config <path>`
# hop-2 subcommand (`subagent_runner_cmd.rs`) that calls straight into its `background::runner_main`.
cyrup-ext-subagents = { workspace = true }
cyrup-permission-system = { workspace = true }
# The Intercom companion (out-of-band supervisor coordination): registered as a native built-in at
# all three session construction sites below (child-mode gated), plus this bin owns the hidden
# `__intercom-broker` subcommand (`intercom_broker_cmd.rs`) that re-execs into the standalone broker
# process (`cyrup_intercom::broker::run`), mirroring the `__subagent-runner` hop.
cyrup-intercom = { workspace = true }
# Flux (spec/flux.md §3.4.5): the pipeline's bundled prompt templates + the three native
# renderers. Attached unconditionally at the top level (no install gate) at all three session
# construction sites below, matching the sibling extension seams above.
cyrup-flux = { workspace = true }
# The MCP adapter (gap-analysis 13, the `pi-mcp-adapter` port): registered as a native built-in at
# all three session construction sites below. Upstream is an INSTALLED PACKAGE present in every
# session of every mode, so `mcp_extension_for_env` attaches unconditionally and `--no-extensions`
# reaches it through `NativeExtension::is_ambient() -> true` rather than through the gate.
cyrup-mcp = { workspace = true }
# The ACP front-end (gap-analysis 15, the `pi-acp` port): `AppMode::Acp`'s implementation, reached
# from `crate::run::run_acp_dispatch`. Its `AcpHost` trait is implemented HERE
# (`crate::acp_host::BinaryAcpHost`) rather than in the library, because `session_launch::build_factory`
# and `signals::spawn_abort_on_signal` live in this crate and the dependency cannot be inverted —
# `ACP-Q30`, decided; see `cyrup_acp::sessions::AcpHost`.
#
# **This edge flips `serde_json::Map` to `IndexMap` for the shipped binary** (`preserve_order`, which
# both ACP crates declare non-optionally). That is `ACP-Q1`, decided and stated in full on the
# `[workspace.dependencies]` line — the same finding that got `mermansi` rejected, taken the other
# way here because the ACP wire types ARE the protocol and there is no alternative crate.
cyrup-acp = { workspace = true }
# Package + config subcommands (Pi `package-manager-cli.ts`) drive the resources package manager.
cyrup-resources = { workspace = true }
# The provider seam. **NO `features = ["faux"]` HERE** (PROV-052): this is a NORMAL dependency, and
# Cargo unifies features additively, so enabling `faux` here compiled the scripted test double into
# the shipped binary and made a bare credential-less `cyrup -p hi` answer `No more faux responses
# queued` instead of pi's `formatNoModelsAvailableMessage()`
# (`packages/coding-agent/src/main.ts:852-855` @v0.83.0). The faux edge now lives in
# `[dev-dependencies]` below. Invariant for THIS graph (the one the shipped binary is built from):
#   cargo tree -p cyrup -e features --edges normal | grep faux   →   no output
# (`--workspace` is a different graph and does unify it — see the `[features]` note above; the arm
# in `src/provider.rs` stays compiled out regardless.)
cyrup-provider = { workspace = true }

# Async runtime + streams (arch-11 §5): multi-thread tokio with signal/io-util for modes & signals.
tokio = { workspace = true }
futures = { workspace = true }

# Bin-only externals (arch-00 §7/§8): clap (CLI), anyhow (the anyhow boundary), tracing to stderr.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc                 = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Image `@file` input (file-processor.ts:48-72): MIME sniff + downscale-to-2000px + base64 attach.
image = { workspace = true }
base64 = { workspace = true }
# macOS screenshot `@file` path NFD-variant fallback (file-processor.ts / path-utils.ts:12-14).
unicode-normalization = { workspace = true }
# Startup migrations read/rewrite legacy `oauth.json`/`settings.json`/session-header JSON (migrations.ts).
serde_json = { workspace = true }
# `auth check --json` serializes pi's `AuthCheckResult` object verbatim (main.ts:207) — SEAM-050.
serde = { workspace = true }

[dev-dependencies]
# Dispatch integration tests build a real AgentSessionRuntime over a scripted faux provider in a
# tempdir. `cyrup-ext` is TEST-only here: SEAM-001/002 are asserted from an EXTENSION's point of
# view (the `session_start`/`session_shutdown` consumer Pi's `bindExtensions` serves), which needs
# the `NativeExtension` trait.
#
# `src/tests/dispatch.rs:547,555` names `cyrup_ext::HostServices` and implements the
# `#[cfg(feature = "wasm-host")]` trait method `NativeExtension::set_host_services`
# (`cyrup-ext/src/native.rs:682`), so with the feature off that impl alone is `E0407`.
# `wasm-host` is NOT optional for this crate, and until now no manifest said so: the feature rode in
# on `cyrup-ext`'s `default = ["wasm-host"]` through the workspace table, which sets no
# `default-features = false` (root `Cargo.toml:111`). Stating it on the edge changes the resolved
# graph in exactly zero builds — measured, not assumed: the feature is already on in every
# configuration this workspace can currently produce, `--workspace --no-default-features` included,
# because there each member's defaults come straight back through its siblings' edges. What the edge
# buys is that the requirement SURVIVES the day `cyrup-ext` stops defaulting `wasm-host` on, or any
# edge here gains `default-features = false` — either of which would otherwise turn this crate into a
# wall of `E0432`/`E0407` with nothing in any manifest saying why. This is NOT the PROV-052 shape:
# `wasm-host` is the production capability host, not a test double.
cyrup-ext = { workspace = true, features = ["wasm-host"] }
# PROV-052: the scripted double, TEST-ONLY. `crates/cyrup/src/provider.rs`'s `#[cfg(test)]` module
# and `tests/dispatch.rs` build real sessions over it in-process.
cyrup-provider = { workspace = true, features = ["faux"] }
# PROV-052 — the SELF-dev-dependency that turns this package's own `faux` feature on for `cargo
# test` and nothing else. Cargo permits a package to dev-depend on itself; the effect is that the
# feature is unified into the `cyrup` package for test builds, so the `CARGO_BIN_EXE_cyrup` the
# integration tests spawn has the `--model faux/…` arm compiled in, while `cargo build`,
# `cargo build --release` and `cargo install` — none of which resolve dev-dependencies — do not.
# This is the seam that lets requirement 1 (no faux on a normal edge) and the 69 binary-spawning
# assertions coexist without weakening either.
cyrup = { path = ".", features = ["faux"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
# `tests/catalog_refresh_modes.rs` proves the DRIFT-007 mode gate against a raw loopback listener
# (`127.0.0.1:0`) instead of `https://pi.dev` — tests must never touch the real network. `net` is a
# TEST-only feature addition; the binary's tokio surface is unchanged. `async-trait` is needed for
# the empty `AuthContext` the same test injects so an ambient `HTTP_PROXY` cannot reroute it.
tokio = { workspace = true, features = ["net"] }
async-trait = { workspace = true }
