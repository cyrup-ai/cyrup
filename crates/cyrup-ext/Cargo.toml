[package]
name = "cyrup-ext"
description = "WASM Component Model host (Wasmtime) + native built-in extensions (arch-08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[build-dependencies]
# EXT-028: `build.rs` `include!`s `src/build/abi.rs` to fingerprint the ABI sources (both
# `world.wit` copies + the `cyrup-ext-sdk` guest crate) that live OUTSIDE an authored extension
# crate, so an SDK/WIT edit busts the Tier-1 artifact cache. Same hasher as the runtime key.
blake3 = "1.8.5"

[dependencies]
cyrup-core = { workspace = true }
cyrup-agent = { workspace = true }
cyrup-tools = { workspace = true }
cyrup-provider = { workspace = true }
cyrup-session = { workspace = true }
thiserror = { workspace = true }
wasmtime = { version = "46.0.1", features = ["component-model", "async", "pooling-allocator", "runtime", "cranelift", "wat"], optional = true }
wasmtime-wasi = { version = "46.0.1", optional = true }
blake3 = "1.8.5"
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = "0.1.44"
dashmap.workspace = true
# `EXACT_PACKAGE_VERSION_RE` (`npx-resolver.ts:10`), the only regular expression in this crate.
# MCP-105 pins `npx -y pkg@1.2.3` to the `_npx` copy whose `package.json` version is exactly
# `1.2.3`, and the discriminator between "an exact version" and "a range" is upstream's pattern —
# reproduced rather than approximated, because `pkg@1.2` and `pkg@^1.2.0` must pin NOTHING while
# `pkg@1.2.3-rc.1+build.5` must pin. No new resolution surface: `regex` is already a per-crate
# dependency of `cyrup-mcp` and `cyrup-permission-system` at the same major, and Rust's `regex` is a
# finite automaton with a linear-time matching guarantee.
regex = "1.12.4"
# The `http-client` capability grant (arch-08 §3.2 draft; pi-mcp-adapter-port.md §3.2), backing
# `caps::http::HttpCaps` — a real `reqwest`-based engine. Optional (bundled into `wasm-host`) so a
# `--no-default-features` build of the native-only foundation pulls neither wasmtime nor reqwest.
reqwest = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
# Manual `Content-Encoding` decompression that preserves the original wire headers (matches real
# `fetch()`; `reqwest`'s own built-in decompression strips them) — see the workspace `Cargo.toml`
# comment above `async-compression` for the full citation.
async-compression = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["io"], optional = true }

[dev-dependencies]
# The END-TO-END fail-closed proof (`tests/ext_fail_closed.rs`, EXT-001): a real `cyrup_agent::Agent`
# driven by the scripted faux provider, with `ExtensionHost::hooks()` installed as its `Hooks`, so a
# faulting `tool_call` handler is observed to leave the tool's `execute` UNCALLED — not merely to
# return a `Blocked` status. Lock-neutral: cyrup-provider is already a dependency and `faux` is a
# pure-Rust in-crate feature that pulls no new crate.
cyrup-provider = { workspace = true, features = ["faux"] }

# `tempfile` was here for `tests/build_tier1.rs`, which drives a REAL `cargo build --target
# wasm32-wasip2` and must tie that build's ~213 MB artifact cache to a `TempDir` (it once wrote to a
# nanos-suffixed `std::env::temp_dir()` path and never removed it; 57 accumulated copies filled this
# box's 16 GB `/tmp` tmpfs and made `ld` die with SIGBUS while linking unrelated doctests). That
# test moved to `crates/cyrup-it/tests/ext/build_tier1.rs` and took its `tempfile` edge with it —
# nothing under `crates/cyrup-ext/` references `tempfile` any more, so the dev-dependency is gone.

[features]
# The whole Wasmtime Component Model host is behind `wasm-host` (arch-08 §2) so the
# native-builtin dispatch foundation (seams, registry, manifest, cache) builds without
# pulling Wasmtime. Default-on here so `cargo check --workspace` exercises the host path.
default = ["wasm-host"]
wasm-host = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:reqwest", "dep:bytes", "dep:async-compression", "dep:tokio-util"]
# NOTE: does NOT depend on cyrup-tui — extension UI crosses as serializable commands
# (arch-00 §2.1, ADR-0001 R-ARCH-TUI-014 / ADR-0002 R-ARCH-EXT-010).
