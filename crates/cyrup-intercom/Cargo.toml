[package]
name = "cyrup-intercom"
description = "Intercom: out-of-band supervisor coordination companion (native cyrup-ext extension + standalone broker process; 1:1 port of pi-intercom)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Builds the real-broker-participant test-double binary (`cyrup-intercom-child-fixture`) used by the
# `crates/cyrup-it/tests/intercom/child_bridge_activation.rs` production-activation proof: unlike the
# scripted-NDJSON `cyrup-subagent-fixture` (which only proves the spawn overlay DELIVERS the
# child-bridge env), that binary actually READS the env via the production
# `read_child_orchestrator_metadata()` gate, registers on the broker under its deterministic label,
# and completes a `contact_supervisor` round trip. Never enabled for the real `cyrup` binary or any
# non-test build — the `[[bin]]` target below is gated on `required-features` so it is not even
# compiled, let alone shipped, unless a caller (`crates/cyrup-it/build.rs:70`, which builds it with
# `--features test-fixtures` into a private `$OUT_DIR`) explicitly opts in.
test-fixtures = []

[dependencies]
cyrup-core = { workspace = true }
cyrup-ext = { workspace = true }
# Only for the two seam traits (`ClarifyChannel`/`DeliveryChannel`) + `IntercomPayload`/`RunId`
# (`tui::intercom`). One-directional (no cycle): subagents never depends on intercom.
cyrup-ext-subagents = { workspace = true }
# ICOM-004 — the bundled `skills/pi-intercom/SKILL.md` is discovered through the SAME
# `cyrup_resources::resolve_manifest` auto-discovery `cyrup-ext-subagents` uses for its own bundled
# skill/prompts/agents (`registration/resources.rs`), rather than a second, private walk. Nothing in
# `cyrup-resources` depends on this crate, so there is no cycle.
cyrup-resources = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "signal", "process"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# randomUUID for sessionId/questionId/messageId/requestId (pi uses crypto.randomUUID = v4).
uuid = { workspace = true, features = ["v4"] }
# Display-column width for the `ui/*` overlay ports (pi's `visibleWidth`/`truncateToWidth`,
# `@earendil-works/pi-tui`). Not a workspace-table dep; already resolved at 0.2.2 in Cargo.lock
# (ratatui pulls it), and cyrup-tui measures the same way (via ratatui's `Span::width`). Pinned
# directly here rather than widening the workspace surface, matching the `tracing` precedent above.
unicode-width = "0.2"
# `tracing` is not (yet) a workspace-table dep; cyrup-ext-subagents pins it directly at the same
# version — matched here rather than introducing a new workspace-wide version surface.
tracing = "0.1.44"

# `nix` is POSIX-only and will not build for `*-pc-windows-*`. Every use in this crate already sits
# behind `#[cfg(unix)]` (`broker::runtime_claim::probe_pid`, `transport::spawn::{pid_alive,
# broker_wait_error}`), so the DEPENDENCY has to be gated too or the crate — and with it the `cyrup`
# binary, which takes cyrup-intercom as a non-optional dependency — cannot be produced for Windows.
# `signal` = the kill(pid,0) liveness probe; `process` = setsid (unused today — detach uses the
# unsafe-free `process_group(0)`, mirroring cyrup-ext-subagents' spawn precedent).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[[bin]]
# The real-broker-participant test-double `cyrup`-child stand-in (the claim-6 production-activation
# proof): reads its child-orchestrator metadata from the process env via the production
# `read_child_orchestrator_metadata()` gate, registers on the broker under its deterministic label,
# sends a `contact_supervisor`-shaped ask to its supervisor, and echoes the reply as final output.
# Never built for, or shipped inside, the real `cyrup` binary — same `required-features` gating as
# `cyrup-ext-subagents`'s `cyrup-subagent-fixture`.
name = "cyrup-intercom-child-fixture"
path = "src/bin/cyrup_intercom_child_fixture.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` supplies `#[tokio::test(start_paused = true)]` + `tokio::time::advance`, which the
# reconnect-backoff test uses instead of real sleeps (ICOM-025): a wall-clock assertion over a
# 1000 ms timer plus a spawn hop is intermittent red on a loaded tree, and widening the slack hides
# the backoff regression the test exists to catch. Dev-only.
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread", "process", "test-util"] }
