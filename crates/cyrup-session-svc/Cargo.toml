[package]
name = "cyrup-session-svc"
description = "The AgentSession facade wiring provider+agent+tools+session+config+ext (arch-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Off by default (native-only build, no wasmtime). Enabling forwards to cyrup-ext's existing
# `wasm-host` feature so the extension host spins up the Wasmtime engine and `LiveHostServices` is
# injected into live wasm extension loads. Enabling is gated on the wasm32-wasip2 guest toolchain
# for a full end-to-end (see the residual ledger, cyrup-session-svc L7 row); the injection SEAM and
# the control→session-effect bridge are always compiled + tested.
wasm-host = ["cyrup-ext/wasm-host"]

[dependencies]
cyrup-core = { workspace = true }
cyrup-agent = { workspace = true }
cyrup-provider = { workspace = true }
cyrup-tools = { workspace = true }
cyrup-session = { workspace = true }
cyrup-config = { workspace = true }
cyrup-resources = { workspace = true }
cyrup-ext = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
cyrup-core = { workspace = true }
cyrup-agent = { workspace = true }
cyrup-ext = { workspace = true }
cyrup-session = { workspace = true }
cyrup-config = { workspace = true }
cyrup-tools = { workspace = true }
# Lock-neutral: cyrup-provider is already a dependency; `faux` pulls no new crate.
cyrup-provider = { workspace = true, features = ["faux"] }
