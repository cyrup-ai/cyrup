[package]
name = "cyrup-modes"
description = "print / json / rpc adapters over the AgentSession seam (arch-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
cyrup-core = { workspace = true }
# Named only from `#[cfg(test)]` code today (`src/rpc.rs:1683` reaches `cyrup_ext::DialogOptions`,
# `src/tests/modes.rs` and `src/tests/rpc_agent_settled.rs` reach `cyrup_ext::host::*`) — but a
# `cfg(test)` use still has to compile, so `--all-targets` breaks without the feature just as a
# non-test use would. Declared on this edge rather than a dev edge so the requirement holds under
# every target selection.
# `wasm-host` is NOT optional for this crate, and until now no manifest said so: the feature rode in
# on `cyrup-ext`'s `default = ["wasm-host"]` through the workspace table, which sets no
# `default-features = false` (root `Cargo.toml:111`). Stating it on the edge changes the resolved
# graph in exactly zero builds — measured, not assumed: the feature is already on in every
# configuration this workspace can currently produce, `--workspace --no-default-features` included,
# because there each member's defaults come straight back through its siblings' edges. What the edge
# buys is that the requirement SURVIVES the day `cyrup-ext` stops defaulting `wasm-host` on, or any
# edge here gains `default-features = false` — either of which would otherwise turn this crate into a
# wall of `E0432`/`E0407` with nothing in any manifest saying why. This is NOT the PROV-052 shape:
# `wasm-host` is the production capability host, not a test double.
cyrup-ext = { workspace = true, features = ["wasm-host"] }
# TOOL-037: pi's `writeRawStdout` retries `ENOBUFS`, which Rust has no `io::ErrorKind` for.
libc = { workspace = true }
cyrup-session-svc = { workspace = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true }
tokio.workspace = true

# SEAM-017: `RpcClient::stop` sends Pi's graceful `SIGTERM` before escalating to `SIGKILL`
# (rpc-client.ts:149-156). `tokio::process::Child::kill` is SIGKILL-only and `libc::kill` is
# `unsafe`, which this crate forbids — so the signal goes through `nix`'s safe wrapper, the same
# route `cyrup-ext-subagents` already uses (background/control.rs:433-434).
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[dev-dependencies]
cyrup-provider = { workspace = true, features = ["faux"] }
# SEAM-024: the RPC `abort` test drives a session into a long auto-retry backoff, which needs the
# `retry.baseDelayMs` knob off the settings seam. Test-only.
cyrup-config = { workspace = true }
# The RPC seam tests declare their own `NativeExtension` impls, whose trait methods are async.
async-trait.workspace = true
# SEAM-015: the RPC bash test declares its own `cyrup_tools::ops::BashOperations` backend — the
# per-call remote-exec seam an extension supplies through `user_bash` — to prove the wire command
# actually runs on it instead of the local shell. Test-only; production `cyrup-modes` never names a
# bash backend, it only forwards `BashOptions`.
cyrup-tools = { workspace = true }
tempfile.workspace = true
