[package]
name = "cyrup-modes"
description = "print / json / rpc adapters over the AgentSession seam (arch-11)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
cyrup-core = { workspace = true }
cyrup-ext = { workspace = true }
# TOOL-037: pi's `writeRawStdout` retries `ENOBUFS`, which Rust has no `io::ErrorKind` for.
libc = { workspace = true }
cyrup-session-svc = { workspace = true }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = { workspace = true }
tokio.workspace = true
tokio-stream.workspace = true

[dev-dependencies]
cyrup-provider = { workspace = true, features = ["faux"] }
# SEAM-024: the RPC `abort` test drives a session into a long auto-retry backoff, which needs the
# `retry.baseDelayMs` knob off the settings seam. Test-only.
cyrup-config = { workspace = true }
tempfile.workspace = true
