[package]
name = "cyrup-ext-sdk"
description = "Guest SDK for authoring cyrup extensions in Rust, compiled to wasm32-wasip2 (arch-08)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Guest crate. Built for wasm32-wasip2 (NOT the host target); excluded from the workspace
# default-members. `cdylib` so `cargo build -p cyrup-ext-sdk --target wasm32-wasip2` emits a
# `cyrup:ext` COMPONENT directly (the wasm32-wasip2 linker componentizes); `rlib` so the ergonomic
# layer (events, descriptors, outcomes, dispatch) is unit-testable on the host target.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The WIT bindings are only generated for the wasm guest target; on the host target the crate is a
# plain rlib (no wasm import/export intrinsics to link).
wit-bindgen = "0.58.0"
