[package]
name = "cyrup-ext-subagents"
description = "SubAgents: OS-subprocess delegation extension (arch-SA; native cyrup-ext extension)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Builds the scripted-NDJSON test-double binary (`cyrup-subagent-fixture`, arch-SA §11) used by
# this crate's own integration tests and by later phases' spawn-boundary/model-fallback/
# background-job tests. Never enabled for the real `cyrup` binary or any non-test build — the
# `[[bin]]` target below is gated on `required-features` so it is not even compiled, let alone
# shipped, unless a caller (this crate's own dev-dependency closure, via `cargo test`) explicitly
# opts in.
test-fixtures = []

[build-dependencies]
# WORKFLOW_1 §7: builds the V8 startup snapshot at compile time. The extension itself (ops +
# `extension!` + `js/prelude.js`) lives in `cyrup-workflow-runtime`, not here, because a build
# script can never import from the crate whose build it is running — see that crate's module doc
# and this crate's own `build.rs`.
cyrup-workflow-runtime = { workspace = true }

[dependencies]
cyrup-core = { workspace = true }
# WORKFLOW_1 §7: the workflowScript ops + `extension!` declaration + `js/prelude.js`, used at real
# runtime by `workflows/scripted/engine.rs` (which bridges them to `RunShared` through
# `WorkflowOpsBridge`) alongside this crate's own `build.rs`, which uses it to produce the startup
# snapshot `engine.rs` loads back via `include_bytes!`.
cyrup-workflow-runtime = { workspace = true }
# `src/tui/fleet_overlay.rs:43` names `cyrup_ext::{InteractiveOverlay, OverlayKey,
# OverlayKeyCode, OverlayLine, OverlayOutcome}` (and `fleet_theme.rs`, `tui/notices.rs`,
# `background/watch.rs` follow), all re-exported only under `wasm-host`
# (`cyrup-ext/src/lib.rs:205-212`).
# `wasm-host` is NOT optional for this crate, and until now no manifest said so: the feature rode in
# on `cyrup-ext`'s `default = ["wasm-host"]` through the workspace table, which sets no
# `default-features = false` (root `Cargo.toml:111`). Stating it on the edge changes the resolved
# graph in exactly zero builds — measured, not assumed: the feature is already on in every
# configuration this workspace can currently produce, `--workspace --no-default-features` included,
# because there each member's defaults come straight back through its siblings' edges. What the edge
# buys is that the requirement SURVIVES the day `cyrup-ext` stops defaulting `wasm-host` on, or any
# edge here gains `default-features = false` — either of which would otherwise turn this crate into a
# wall of `E0432`/`E0407` with nothing in any manifest saying why. This is NOT the PROV-052 shape:
# `wasm-host` is the production capability host, not a test double.
cyrup-ext = { workspace = true, features = ["wasm-host"] }
# `prompt_runtime.rs`'s child-side `context` hook (pi `subagent-prompt-runtime.ts:317-321`) filters
# the LIVE message list, and that seam is typed: `cyrup_ext::EventPatch::Context` carries a
# `Vec<cyrup_agent::AgentMessage>`, so the filter cannot be written against an opaque JSON value the
# way `exec/ndjson.rs` deliberately treats a CHILD's NDJSON stream. This names the type that seam
# already requires — `cyrup-ext` (a direct dependency above) depends on `cyrup-agent` itself, so no
# new layering is introduced. NB `cyrup_session::AgentMessage` is a DIFFERENT type (a session-entry
# message); the extension seam wants the agent-loop one.
cyrup-agent = { workspace = true }
cyrup-session = { workspace = true }
cyrup-config = { workspace = true }
cyrup-resources = { workspace = true }
# `/subagents-models` and `/subagents-refresh-provider-models` (R-SA-129/130 gap closure): the
# only genuine, already-built provider/model-catalog surface in the workspace today is this
# crate's static, embedded seed catalog (`catalog::seed_catalog`/`load_catalog`) — full
# models.dev live-probe generation/refresh is explicitly DEFERRED (func-SA §9 item 31, arch-SA
# §12 item 11), so this dependency is used ONLY for that already-real static-catalog read, never
# to invent the deferred live-probe algorithm. `cyrup-ext` (already a direct dependency above)
# itself depends on `cyrup-provider`, so this adds no new layering cycle.
cyrup-provider = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time", "signal", "macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
# SUBA-082: an agent file's `acceptance:` frontmatter value is YAML upstream
# (`parseAgentAcceptanceFrontmatter` calls `parseYaml`, `agents.ts:1916` @v0.64.0 — a bare scalar,
# a JSON object, a YAML flow map with unquoted keys, or a nested block are all documented forms),
# so `discovery/frontmatter.rs` parses it with the same crate `cyrup-resources` already uses for
# its own frontmatter rather than a JSON-only reader that would reject the documented flow-map form.
serde_yml = "0.0.13"
thiserror = { workspace = true }
async-trait = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
notify = { workspace = true }
# Parent-side JSON-Schema re-validation of a subagent child's structured-output value (R-SA-030,
# `exec/structured.rs`) — see the workspace `Cargo.toml`'s own comment above this dependency's
# entry for the full crate-choice rationale (`jsonschema` over `schemars`) and why default
# features (remote/file `$ref` resolution) are disabled.
jsonschema = { workspace = true }
# `v4` added on top of the workspace-default `v7` feature: `background::RunId` (R-SA-072) needs
# pure random entropy for an opaque, non-orderable run token, whereas `atomic.rs`'s temp-filename
# nonce and `background::control`'s stop-request file names deliberately want v7's sortable,
# monotonic timestamp prefix — both features compose additively (`v7` named here as well so this
# crate's own use of `Uuid::now_v7` does not silently depend on workspace feature unification).
uuid = { workspace = true, features = ["v4", "v7"] }
libc = { workspace = true }
# G90 steer: pi names a steer-request file `<ts>-<base64url(id)>.json`
# (`control-channel.ts:85-87` @v0.34.0), so the id — an arbitrary caller-supplied string —
# is base64url-encoded rather than interpolated raw, which is what keeps a path separator
# out of the file name. Already a `[workspace.dependencies]` entry used by five sibling
# crates; pure Rust, no C.
base64 = { workspace = true }
# SUBA-3c (`exec/mutation_evidence/`, pi `runs/shared/mutation-evidence.ts`): tracked-file status
# and per-path fingerprinting for the timeout-recovery evidence a deadline kill collects. In-process
# `gix` instead of a `git` subprocess — see the justifying comment on the `[workspace.dependencies]`
# entry (default features only; the network features `cyrup-resources` pins are deliberately absent).
gix = { workspace = true }
# SHA-256 for the direct-MCP metadata-cache config-identity hash (`exec/mcp_direct_tools.rs`,
# pi `computeMcpServerHash`) — the resolver validates a cached server's tool/resource metadata is
# still current by hashing the resolution-relevant fields of its `mcp.json` definition and
# comparing against the cache's stamped `configHash`. Same version `cyrup-config` already pins for
# its own PKCE/auth hashing, so no new workspace-wide version surface is introduced.
sha2 = "0.11.0"
# NFKC normalization for the watchdog emission guard's dedup identity
# (`watchdog/emission-guard.ts:43`'s `value.normalize("NFKC")`): two warnings that differ only by a
# compatibility form must collide on one identity, or the same finding re-warns every turn. Already a
# `[workspace.dependencies]` entry (`cyrup-tools` uses it for the same reason); pure Rust, no C.
unicode-normalization = { workspace = true }
# WHATWG URL parsing for the mission store's delivery-receipt validation (`missions/store.rs`,
# pi `new URL(url)` at `pi-subagents/src/missions/store.ts:170-174`). See the justifying comment
# on the `[workspace.dependencies]` entry.
url = { workspace = true }
tracing = "0.1.44"
# SCOPE_3f (`workflows/scripted/{recovery,preview}.rs` ONLY): the acceptance-recovery classifier's
# ~36 upstream regexes include tempered greedy tokens (a negative lookahead inside a bounded
# repetition, `scripted-workflow.ts:1185-1188`) that the `regex` crate cannot express. Pure Rust,
# already in this workspace's lockfile via `syntect`'s `default-fancy` — zero new transitive
# crates. See the justifying comment on the `[workspace.dependencies]` entry.
fancy-regex = { workspace = true }
# SCOPE_3f (`workflows/scripted/`): the workflowScript runtime embeds V8 through `deno_core` — the
# same engine core Deno itself ships. Chosen because the ONE correctness term that decides this
# feature is whether the engine behaves the way the authoring model predicts, and the model's prior
# is V8-in-Node (SCOPE_3f §0.2 bar (b)); every other engine is a different implementation with
# different edge behaviour, error text and stack format. `deno_core` ops are natively async on
# tokio, so a child launch is an op the script awaits — no handle/poll protocol (§3.2).
#
# V8 is C++. `Cargo.toml`'s rule is "no C dependency WHERE A PURE-RUST ALTERNATIVE EXISTS"; the
# pure-Rust alternative (`boa_engine`) fails bar (b), which is the term the feature rests on. This
# is the same carve-out already exercised for `aws-lc-sys`, `ring`, `tree-sitter` and `zstd-sys`.
# `forbid(unsafe_code)` is a per-crate lint and is unaffected transitively (SCOPE_3f §1.3).
#
# `deno_runtime` is deliberately NOT a dependency: it is what would add `fetch`, `fs`, `net` and the
# `setTimeout` global. `deno_core` alone lands exactly where upstream's `vm.createContext` lands —
# ECMAScript intrinsics and our ops, nothing else (§0.3, §3.3).
deno_core = { workspace = true }
# The structural analyzer behind `action:"validate"` (§3.6): scope-aware free-identifier resolution,
# so a script referencing `setTimeout`/`fetch`/`require` is rejected with a re-prompt BEFORE a child
# is spent. V8 owns syntax; this owns structure. Version-aligned with the deno stack above.
deno_ast = { workspace = true }
deno_error = { workspace = true }
# `tui/render.rs`'s pure fold-to-aggregate rendering functions (R-SA-106..113) return
# `ratatui::text::Line`/`Span` values so a live terminal owner (`cyrup-tui`, out of scope for
# this crate — see arch-SA §1.1/§6.1's crate-boundary rule) can paint them without this crate
# depending on `cyrup-tui` itself. Same pinned version `cyrup-tui`/`cyrup-test-support` use
# directly (not workspace-aliased there either); no `crossterm`/backend features needed here since
# this crate never owns a live terminal, only builds renderable line/span values.
ratatui = "0.30.2"

[[bin]]
# The scripted-NDJSON test-double `cyrup`-shaped binary (arch-SA §11): emits scripted NDJSON
# events on stdout and responds to signals deterministically, driven entirely by a JSON script
# file named via `CYRUP_SUBAGENT_FIXTURE_SCRIPT`. Used as the `CYRUP_SUBAGENT_BINARY` override
# target (R-SA-045 tier 1) in this crate's own integration tests and later phases' spawn-boundary/
# model-fallback/background-job tests — never built for, or shipped inside, the real `cyrup`
# binary (`crates/cyrup/`), which has no dependency on this crate's `test-fixtures` feature at
# all.
name = "cyrup-subagent-fixture"
path = "src/bin/cyrup_subagent_fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
# A-SA-12's own tiny helper binary (func-SA §7): plays the role of "the orchestrator" as a real,
# separate, killable OS process so an integration test can kill it mid-background-run and observe
# that the detached runner it spawned survives independently (DI-SA-8/R-SA-070/071). See that
# binary's own module doc for the full rationale/contract. Same never-shipped-in-real-`cyrup`
# gating as `cyrup-subagent-fixture` above.
name = "cyrup-subagent-orchestrator-sim"
path = "src/bin/cyrup_subagent_orchestrator_sim.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
tempfile = { workspace = true }
# TEST-ONLY oracle for `exec/tool_surface.rs::host_builtin_tool_names_track_the_tool_registry`.
# `HOST_BUILTIN_TOOL_NAMES` is the closed set of built-in tool names `ToolRegistry::with_builtins`
# installs, in wire order — the vocabulary a host observation is validated against. Extension tools
# are merged in AFTER the allowlist filter
# (`cyrup-session-svc/src/builder.rs:1075` -> `:1499` -> `cyrup-ext/src/registry.rs:1319`), so the
# CSV proves nothing about them. `cyrup_tools::BUILTIN_NAMES` answers a DIFFERENT question (which
# tools the registry installs, in wire order). The two coincide today and the test fails the build
# the day they stop — but the sets stay separately stated, and production code in this crate never
# names `cyrup_tools`, exactly as `cyrup-permission-system/Cargo.toml:112` does for its own
# `BUILT_IN_TOOL_NAMES`. An alias would silently widen a REFUSAL vocabulary to any name a future
# registry adds, which is the dangerous direction. No new compile surface: `cyrup-tools` is already
# normal-reachable through `cyrup-ext` with the same default features.
cyrup-tools = { workspace = true }
# CROSS-CRATE CONFORMANCE, TEST-ONLY (MCP-141/142/146/370). `exec/mcp_direct_tools.rs` is the READER
# of `<agent_dir>/mcp-cache.json`; `cyrup-mcp` is its WRITER, and the two also have to agree on the
# name a direct MCP tool is registered under. They share an on-disk file rather than a type — on
# purpose, because resolving a subagent's `mcp:` selectors must not drag the whole MCP adapter
# (rmcp, reqwest, oauth2) into a spawn — so nothing but a test can prove the two implementations of
# that contract still produce the same bytes. They silently did not, for four separate reasons, until
# this dependency existed to catch it: `mcp_direct_tools::tests` now asserts its `configHash`
# pre-image, its digest and its tool names against `cyrup_mcp::dirs` / `cyrup_mcp::registration`
# themselves rather than against constants copied out of that crate's tests, which is the difference
# between drift being impossible and drift being merely detectable. Dev-only: `[dependencies]` above
# is unchanged, so no production layering is introduced (and `crates/cyrup`, the one binary that
# links both, already depends on `cyrup-mcp` directly).
cyrup-mcp = { workspace = true }
# SUBA-032: `#[tokio::test(start_paused = true)]` + `tokio::time::advance` — the virtual clock that
# replaces `tui/notices.rs`'s three real-clock sleeps around a 60 ms debounce, whose load-bearing
# assertion landed 15 ms inside the deadline and flaked under machine load. Dev-only: the feature
# is additive to the runtime features the production dependency above already enables, and nothing
# in `src/` outside `#[cfg(test)]` references it.
tokio = { workspace = true, features = ["test-util"] }
# `artifacts.rs`'s 7-day sweep / 24h-throttle unit tests must backdate an artifact's mtime to prove
# a file older than the cleanup horizon is deleted while a fresh one survives; `std::fs` has no
# portable mtime setter and this crate is `#![forbid(unsafe_code)]` (so a `libc::utimes` call is not
# available in a `src/`-module test). `filetime` is already in the workspace lock (a transitive
# dependency), so this adds no new resolution surface — it only surfaces the existing crate as a
# dev-only dependency. Dev-only: never referenced from production code.
filetime = "0.2"
# `tui::render`'s tests paint into a real `TestBackend` grid via `cyrup_test_support::tui::
# TestTerminal` (mirroring `crates/cyrup-tui/tests/assembled_render.rs`'s whole-buffer text-grid
# pattern) rather than asserting on `Line`/`Span` structure alone. Not aliased in
# `[workspace.dependencies]` (no existing crate depends on it as a dev-dependency yet), so this is
# a plain path dependency, matching how the crate itself is declared as a workspace member.
cyrup-test-support = { path = "../cyrup-test-support" }
# `tests/extension_end_to_end_smoke.rs` asserts on `AgentSessionEvent::{ToolExecutionStart,
# ToolExecutionEnd}` observed on a REAL `cyrup-test-support`-built session (the only way to prove
# `extension.rs`'s `NativeExtension`/`Tool` registration actually reaches a live session's tool
# registry) — `cyrup-test-support`'s own `Harness` uses this type internally but does not
# re-export it at its crate root, so this crate's dev-dependency closure needs it directly, dev-only
# (never a production dependency: `cyrup-ext-subagents` itself has zero `cyrup-session-svc`
# dependency in `[dependencies]` above, preserving this crate's own crate-boundary rule that it
# never depends on the session-service facade in production code).
cyrup-session-svc = { workspace = true }
