[package]
name = "cyrup-ext-subagents"
description = "SubAgents: OS-subprocess delegation extension (arch-SA; native cyrup-ext extension)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Builds the scripted-NDJSON test-double binary (`cyrup-subagent-fixture`, arch-SA §11) used by
# this crate's own integration tests and by later phases' spawn-boundary/model-fallback/
# background-job tests. Never enabled for the real `cyrup` binary or any non-test build — the
# `[[bin]]` target below is gated on `required-features` so it is not even compiled, let alone
# shipped, unless a caller (this crate's own dev-dependency closure, via `cargo test`) explicitly
# opts in.
test-fixtures = []

[dependencies]
cyrup-core = { workspace = true }
cyrup-ext = { workspace = true }
# `prompt_runtime.rs`'s child-side `context` hook (pi `subagent-prompt-runtime.ts:317-321`) filters
# the LIVE message list, and that seam is typed: `cyrup_ext::EventPatch::Context` carries a
# `Vec<cyrup_agent::AgentMessage>`, so the filter cannot be written against an opaque JSON value the
# way `exec/ndjson.rs` deliberately treats a CHILD's NDJSON stream. This names the type that seam
# already requires — `cyrup-ext` (a direct dependency above) depends on `cyrup-agent` itself, so no
# new layering is introduced. NB `cyrup_session::AgentMessage` is a DIFFERENT type (a session-entry
# message); the extension seam wants the agent-loop one.
cyrup-agent = { workspace = true }
cyrup-session = { workspace = true }
cyrup-config = { workspace = true }
cyrup-resources = { workspace = true }
# `/subagents-models` and `/subagents-refresh-provider-models` (R-SA-129/130 gap closure): the
# only genuine, already-built provider/model-catalog surface in the workspace today is this
# crate's static, embedded seed catalog (`catalog::seed_catalog`/`load_catalog`) — full
# models.dev live-probe generation/refresh is explicitly DEFERRED (func-SA §9 item 31, arch-SA
# §12 item 11), so this dependency is used ONLY for that already-real static-catalog read, never
# to invent the deferred live-probe algorithm. `cyrup-ext` (already a direct dependency above)
# itself depends on `cyrup-provider`, so this adds no new layering cycle.
cyrup-provider = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "sync", "time", "signal", "macros", "rt-multi-thread"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
nix = { workspace = true, features = ["signal", "process"] }
notify = { workspace = true }
# Parent-side JSON-Schema re-validation of a subagent child's structured-output value (R-SA-030,
# `exec/structured.rs`) — see the workspace `Cargo.toml`'s own comment above this dependency's
# entry for the full crate-choice rationale (`jsonschema` over `schemars`) and why default
# features (remote/file `$ref` resolution) are disabled.
jsonschema = { workspace = true }
# `v4` added on top of the workspace-default `v7` feature: `background::RunId` (R-SA-072) needs
# pure random entropy for an opaque, non-orderable run token, whereas `atomic.rs`'s temp-filename
# nonce deliberately wants v7's sortable timestamp prefix — both features compose additively.
uuid = { workspace = true, features = ["v4"] }
libc = { workspace = true }
# G90 steer: pi names a steer-request file `<ts>-<base64url(id)>.json`
# (`control-channel.ts:85-87` @v0.34.0), so the id — an arbitrary caller-supplied string —
# is base64url-encoded rather than interpolated raw, which is what keeps a path separator
# out of the file name. Already a `[workspace.dependencies]` entry used by five sibling
# crates; pure Rust, no C.
base64 = { workspace = true }
# SHA-256 for the direct-MCP metadata-cache config-identity hash (`exec/mcp_direct_tools.rs`,
# pi `computeMcpServerHash`) — the resolver validates a cached server's tool/resource metadata is
# still current by hashing the resolution-relevant fields of its `mcp.json` definition and
# comparing against the cache's stamped `configHash`. Same version `cyrup-config` already pins for
# its own PKCE/auth hashing, so no new workspace-wide version surface is introduced.
sha2 = "0.11.0"
# NFKC normalization for the watchdog emission guard's dedup identity
# (`watchdog/emission-guard.ts:43`'s `value.normalize("NFKC")`): two warnings that differ only by a
# compatibility form must collide on one identity, or the same finding re-warns every turn. Already a
# `[workspace.dependencies]` entry (`cyrup-tools` uses it for the same reason); pure Rust, no C.
unicode-normalization = { workspace = true }
# WHATWG URL parsing for the mission store's delivery-receipt validation (`missions/store.rs`,
# pi `new URL(url)` at `pi-subagents/src/missions/store.ts:170-174`). See the justifying comment
# on the `[workspace.dependencies]` entry.
url = { workspace = true }
tracing = "0.1.44"
# `tui/render.rs`'s pure fold-to-aggregate rendering functions (R-SA-106..113) return
# `ratatui::text::Line`/`Span` values so a live terminal owner (`cyrup-tui`, out of scope for
# this crate — see arch-SA §1.1/§6.1's crate-boundary rule) can paint them without this crate
# depending on `cyrup-tui` itself. Same pinned version `cyrup-tui`/`cyrup-test-support` use
# directly (not workspace-aliased there either); no `crossterm`/backend features needed here since
# this crate never owns a live terminal, only builds renderable line/span values.
ratatui = "0.30.2"

[[bin]]
# The scripted-NDJSON test-double `cyrup`-shaped binary (arch-SA §11): emits scripted NDJSON
# events on stdout and responds to signals deterministically, driven entirely by a JSON script
# file named via `CYRUP_SUBAGENT_FIXTURE_SCRIPT`. Used as the `CYRUP_SUBAGENT_BINARY` override
# target (R-SA-045 tier 1) in this crate's own integration tests and later phases' spawn-boundary/
# model-fallback/background-job tests — never built for, or shipped inside, the real `cyrup`
# binary (`crates/cyrup/`), which has no dependency on this crate's `test-fixtures` feature at
# all.
name = "cyrup-subagent-fixture"
path = "src/bin/cyrup_subagent_fixture.rs"
required-features = ["test-fixtures"]

[[bin]]
# A-SA-12's own tiny helper binary (func-SA §7): plays the role of "the orchestrator" as a real,
# separate, killable OS process so an integration test can kill it mid-background-run and observe
# that the detached runner it spawned survives independently (DI-SA-8/R-SA-070/071). See that
# binary's own module doc for the full rationale/contract. Same never-shipped-in-real-`cyrup`
# gating as `cyrup-subagent-fixture` above.
name = "cyrup-subagent-orchestrator-sim"
path = "src/bin/cyrup_subagent_orchestrator_sim.rs"
required-features = ["test-fixtures"]

[dev-dependencies]
tempfile = { workspace = true }
# `artifacts.rs`'s 7-day sweep / 24h-throttle unit tests must backdate an artifact's mtime to prove
# a file older than the cleanup horizon is deleted while a fresh one survives; `std::fs` has no
# portable mtime setter and this crate is `#![forbid(unsafe_code)]` (so a `libc::utimes` call is not
# available in a `src/`-module test). `filetime` is already in the workspace lock (a transitive
# dependency), so this adds no new resolution surface — it only surfaces the existing crate as a
# dev-only dependency. Dev-only: never referenced from production code.
filetime = "0.2"
# `tui::render`'s tests paint into a real `TestBackend` grid via `cyrup_test_support::tui::
# TestTerminal` (mirroring `crates/cyrup-tui/tests/assembled_render.rs`'s whole-buffer text-grid
# pattern) rather than asserting on `Line`/`Span` structure alone. Not aliased in
# `[workspace.dependencies]` (no existing crate depends on it as a dev-dependency yet), so this is
# a plain path dependency, matching how the crate itself is declared as a workspace member.
cyrup-test-support = { path = "../cyrup-test-support" }
# `tests/extension_end_to_end_smoke.rs` asserts on `AgentSessionEvent::{ToolExecutionStart,
# ToolExecutionEnd}` observed on a REAL `cyrup-test-support`-built session (the only way to prove
# `extension.rs`'s `NativeExtension`/`Tool` registration actually reaches a live session's tool
# registry) — `cyrup-test-support`'s own `Harness` uses this type internally but does not
# re-export it at its crate root, so this crate's dev-dependency closure needs it directly, dev-only
# (never a production dependency: `cyrup-ext-subagents` itself has zero `cyrup-session-svc`
# dependency in `[dependencies]` above, preserving this crate's own crate-boundary rule that it
# never depends on the session-service facade in production code).
cyrup-session-svc = { workspace = true }
