# cyrup — Cargo workspace (realizes spec/architecture/arch-00-overview-and-workspace.md §2)
# A from-scratch Rust port of the Pi agent harness. RUST ONLY (no JS/TS runtime).
[workspace]
resolver = "3"
members = [
    "crates/cyrup-core",
    "crates/cyrup-provider",
    "crates/cyrup-agent",
    "crates/cyrup-tools",
    "crates/cyrup-session",
    "crates/cyrup-config",
    "crates/cyrup-ext",
    "crates/cyrup-resources",
    "crates/cyrup-tui",
    "crates/cyrup-modes",
    "crates/cyrup-sdk",
    "crates/cyrup-session-svc",
    "crates/cyrup",
    "crates/cyrup-test-support",
    "crates/cyrup-ext-sdk",
    "crates/cyrup-ext-subagents",
    "crates/cyrup-permission-system",
    "crates/cyrup-intercom",
    "crates/cyrup-it",
]
# cyrup-it is the workspace's ONE integration-test crate (docs/TEST-ARCHITECTURE.md §2): it holds
# only the seam tests — the ones that spawn a binary, drive a subagent child, load a live wasm
# component, or open a broker socket. It is a member (so it shares this Cargo.lock, these
# `workspace.dependencies` and these `workspace.lints`) but is NOT in `default-members`, and it has
# no `[lib]` and no `[dependencies]` at all, so nothing can ever depend on it.
#
# THE EXCLUSION BELOW IS NOT ITS GATE. `--workspace` overrides `default-members` entirely, and this
# repo's merge gate is `cargo test --workspace` — exactly the subtlety already conceded for
# cyrup-test-support above. What actually keeps the suite off the everyday path is
# `required-features = ["it"]` on each of its `[[test]]` targets, with `it` default-off; its
# build.rs no-ops on the same signal. Note that `--all-features` re-arms all of it silently.
#
# cyrup-ext-sdk is the GUEST sdk (compiled to wasm32-wasip2); it is NOT part of the
# host binary build graph (arch-00 §2.2), so it is excluded from default-members.
# Build it explicitly: `cargo build -p cyrup-ext-sdk --target wasm32-wasip2`.
#
# cyrup-test-support is likewise excluded (PROV-052). It is the only crate whose `[dependencies]`
# enables `cyrup-provider/faux` — its `src/` IS the scripted harness — and Cargo unifies features
# per package across every crate built in one invocation, so leaving it in `default-members` would
# make a plain `cargo build` at the workspace root compile the test double into the `cyrup` binary
# even after the bin's own edge moved to `[dev-dependencies]`.
#
# This exclusion is DEFENSE IN DEPTH, not the gate. What makes the double unreachable is the
# `#[cfg(feature = "faux")]` on `select_provider`'s `Some("faux")` arm (crates/cyrup/src/provider.rs),
# keyed to the `cyrup` package's own feature — see crates/cyrup-provider/Cargo.toml for the full
# statement. Under `cargo build --workspace` this crate IS built and `cyrup-provider/faux` IS
# unified onto a normal edge; the module is then compiled but still unselectable.
#
# WHAT THE EXCLUSION COSTS, stated exactly (the previous wording here was wrong): cyrup-test-support
# is a dev-dependency of cyrup-permission-system and cyrup-ext-subagents, so a bare `cargo test`
# BUILDS it — but *building* is not *running*. `cargo metadata` confirms it is outside
# `workspace_default_members`, so a bare `cargo test` no longer EXECUTES its 35 `src/` unit tests or
# the 5 in `tests/deferred_interop.rs`. Nothing was lost from the merge gate, which is
# `cargo test --workspace`. If you run a bare `cargo test` locally, add
# `cargo test -p cyrup-test-support` or just use `--workspace`. Nothing depends on this crate
# normally (`publish = false`).
default-members = [
    "crates/cyrup-core",
    "crates/cyrup-provider",
    "crates/cyrup-agent",
    "crates/cyrup-tools",
    "crates/cyrup-session",
    "crates/cyrup-config",
    "crates/cyrup-ext",
    "crates/cyrup-resources",
    "crates/cyrup-tui",
    "crates/cyrup-modes",
    "crates/cyrup-sdk",
    "crates/cyrup-session-svc",
    "crates/cyrup",
    "crates/cyrup-ext-subagents",
    "crates/cyrup-permission-system",
    "crates/cyrup-intercom",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"          # track installed stable (edition 2024 needs >=1.85)
license = "MIT"
repository = "https://github.com/cyrup-ai/cyrup"
authors = ["cyrup contributors"]

# No-panic policy (arch-00 §8 / func-00 R-00-009). These are clippy tool lints:
# they only fire under `cargo clippy`, not `cargo build`/`cargo test`. Tests may
# add per-item `#[allow(...)]` where unwrap/expect is acceptable.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[workspace.dependencies]
# --- in-workspace crates (lockstep version) ---
cyrup-core         = { path = "crates/cyrup-core",         version = "0.0.0" }
cyrup-provider     = { path = "crates/cyrup-provider",     version = "0.0.0" }
cyrup-agent        = { path = "crates/cyrup-agent",        version = "0.0.0" }
cyrup-tools        = { path = "crates/cyrup-tools",        version = "0.0.0" }
cyrup-session      = { path = "crates/cyrup-session",      version = "0.0.0" }
cyrup-config       = { path = "crates/cyrup-config",       version = "0.0.0" }
cyrup-ext          = { path = "crates/cyrup-ext",          version = "0.0.0" }
cyrup-resources    = { path = "crates/cyrup-resources",    version = "0.0.0" }
cyrup-tui          = { path = "crates/cyrup-tui",          version = "0.0.0" }
cyrup-modes        = { path = "crates/cyrup-modes",        version = "0.0.0" }
cyrup-sdk          = { path = "crates/cyrup-sdk",          version = "0.0.0" }
cyrup-session-svc  = { path = "crates/cyrup-session-svc",  version = "0.0.0" }
cyrup-ext-subagents = { path = "crates/cyrup-ext-subagents", version = "0.0.0" }
cyrup-permission-system = { path = "crates/cyrup-permission-system", version = "0.0.0" }
cyrup-intercom     = { path = "crates/cyrup-intercom",     version = "0.0.0" }

# --- standardized external deps (arch-00 §7). Versions are inert until a crate
#     references them via `dep.workspace = true`; verify/bump on first use. ---
tokio        = { version = "1",   features = ["rt-multi-thread", "macros", "sync", "fs", "process", "io-util", "time", "signal"] }
tokio-util   = { version = "0.7" }
tokio-stream = { version = "0.1" }
futures      = { version = "0.3" }
futures-core = { version = "0.3" }
async-trait  = { version = "0.1" }
thiserror    = { version = "2" }
serde        = { version = "1",   features = ["derive", "rc"] }
serde_json   = { version = "1" }

# arch-00 §7.1 ratified — first used by cyrup-tools (arch-03).
ignore               = { version = "0.4.26" }
globset              = { version = "0.4.18" }
grep-matcher         = { version = "0.1.8" }
grep-regex           = { version = "0.1.14" }
grep-searcher        = { version = "0.1.16" }
similar              = { version = "3.1.1" }
dashmap              = { version = "6.2.1" }
unicode-segmentation = { version = "1.13.3" }
unicode-normalization = { version = "0.1.24" }   # tools NFKC/NFD normalization (arch-03)
feruca               = { version = "0.12.0" }    # pure-Rust UCA collation for `ls` localeCompare parity (arch-03, ls.ts:150)
image                = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Clipboard IMAGE *read* for the Ctrl+V paste keybinding (gap-12 F5; first used by cyrup-tui). `arboard`
# is the faithful Rust analog of Pi's native clipboard module (`utils/clipboard-native.ts` →
# `@mariozechner/clipboard`: NSPasteboard on macOS, X11/Wayland on Linux) — a ported mechanism, NOT a
# substituted design. Default features carry the per-platform backend (`core-graphics` on macOS, x11rb
# on Linux); `image-data` exposes `get_image()` → an RGBA raster, which cyrup re-encodes to a PNG temp
# file with the in-tree `image` crate above (arboard depends on the same `image` ^0.25, so it unifies).
arboard              = { version = "3.6.1", features = ["image-data"] }
libc                 = { version = "0.2.186" }
tempfile             = { version = "3.27.0" }

# arch-SA §7 — real OS-signal delivery (SIGINT/SIGTERM/SIGKILL escalation, PID liveness probes)
# and filesystem-change notification (ResultsDir/control-inbox watch), first used by
# cyrup-ext-subagents (arch-SA). New to the workspace.
nix                  = { version = "0.31.3" }
notify               = { version = "8.2.0" }

# arch-SA §5.2/§12 item 13 (R-SA-030) — parent-side JSON-Schema re-validation of a subagent
# child's structured-output value, first used by cyrup-ext-subagents (arch-SA §6.3.3). `jsonschema`
# (not `schemars`) is the correct crate for this: `schemars` only *generates* a JSON Schema from a
# Rust type, it has no validator for an arbitrary runtime `serde_json::Value` against an
# arbitrary, externally-declared schema, which is exactly what R-SA-030 needs. `cyrup-ext`'s own
# tool-parameter validation (`registry.rs::ToolDescriptor::validate`) does only a minimal
# "is-object" shape check today and depends on neither crate, so there is no existing dependency
# to match here (arch-SA §12 item 13's own open question, resolved this way for this crate).
# `default-features = false`: the default `resolve-http`/`resolve-file` features pull in
# `reqwest`/`rustls` to fetch remote/on-disk `$ref` targets — this crate validates a child's
# already-inline structured-output value against an already-inline declared schema, never fetching
# a `$ref` over the network or filesystem, so those features (and their heavyweight deps) are
# never needed here.
jsonschema           = { version = "0.46.9", default-features = false }

# arch-00 §7 — first used by cyrup-session (arch-04).
time                 = { version = "0.3", features = ["formatting", "parsing"] }
uuid                 = { version = "1", features = ["v7"] }

# arch-00 §7 / §7.1 — direct-wire HTTP + SSE stack, first used by cyrup-provider (arch-01).
# `gzip`/`brotli`/`deflate`/`zstd` (each gated via `tower-http`'s decompression layer, reqwest's own
# Cargo.toml) make reqwest transparently decode a `Content-Encoding` response body — matching the
# REAL consumer's behavior 1:1: the MCP SDK's `streamableHttp.js` uses the platform `fetch()`
# (dist/esm/client/streamableHttp.js:89,306,443, @modelcontextprotocol/sdk@1.26.0), and Node's
# `fetch()` auto-decodes standard `Content-Encoding` per the Fetch spec with zero caller-visible
# opt-in. Without these, `cyrup-ext`'s `http-client` capability (caps/http.rs) — the wasm guest's
# ONLY way to make an outbound request — would hand back raw compressed bytes for any server that
# compresses (the common case), silently diverging from what a real `fetch()`-based client sees.
reqwest              = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "gzip", "brotli", "deflate", "zstd"] }
eventsource-stream   = { version = "0.2.3" }
bytes                = { version = "1" }
base64               = { version = "0.22" }
# PROV-030 — RS256 signing for the Google Vertex ADC `service_account` arm. pi delegates the whole
# credential problem to `@google/genai` → `google-auth-library`, which mints a bearer by signing a
# JWT assertion with the service account's RSA key (`api/google-vertex.ts:327-339` @v0.83.0); cyrup
# has no SDK to delegate to, so `cyrup-provider/src/auth/google_adc.rs` performs that signature.
# ADDS NO NEW CRATE TO THE GRAPH: `ring` 0.17 is already resolved in Cargo.lock as a transitive
# dependency of `rustls` (via `reqwest`'s rustls feature) and `quinn-proto`, so this is a direct
# edge onto something already compiled, not a new third-party surface.
ring                 = { version = "0.17" }
# `cyrup-ext-subagents`'s mission store validates a delivery receipt's URL by CONSTRUCTING one —
# pi does `new URL(url)` and treats a throw as "not an absolute URL"
# (`pi-subagents/src/missions/store.ts:170-174`, `actions.ts:161-165`). `url` implements the same
# WHATWG URL Standard `new URL()` does, so the accept/reject boundary matches exactly instead of
# being approximated by a hand-rolled scheme scan. Pure Rust, no C, and already resolved in
# `Cargo.lock` as a transitive dependency of `reqwest`, so this adds no new resolution surface.
url                  = { version = "2.5" }

# arch-00 §7.1 ratified — first used by cyrup-ext (arch-08 §3.2 draft): the real consumer's
# `fetch()` (same `streamableHttp.js` citation as `reqwest` above) preserves the WIRE
# `Content-Encoding`/`Content-Length` in `Response.headers` even while transparently decompressing
# the body (verified live against Node's real `fetch()`, not just the spec) — but `reqwest`'s
# built-in decompression (`tower-http`'s `DecompressionLayer`, wired in via the `gzip`/`brotli`/
# `deflate`/`zstd` features above) unconditionally STRIPS both headers the instant it decompresses
# (`tower_http::decompression::future::ResponseFuture::poll`, `entry.remove()` +
# `parts.headers.remove(CONTENT_LENGTH)` — confirmed by reading that source directly), with no
# opt-out other than disabling the whole per-`Client` runtime toggle (`ClientBuilder::no_gzip()`
# etc., which exist regardless of these cargo features). `cyrup-ext::caps::http` disables that
# runtime toggle and decompresses manually with `async-compression`'s already-resolved codecs (the
# SAME crates `tower-http`'s decompression layer already pulls in transitively — this promotes an
# existing dependency-graph member to a direct one, not a new codec implementation) so it can return
# the decompressed body AND the untouched original headers, matching real `fetch()` exactly.
async-compression    = { version = "0.4.33", features = ["tokio", "gzip", "brotli", "deflate", "zstd"] }

# arch-10 §7 / §8 — rich-rendering stack, first used by cyrup-tui (arch-10, spec/tui/06).
# User-ratified for the L6 round (markdown + syntax + inline images). `syntect` uses the pure-Rust
# `fancy-regex` engine (`default-fancy`) — NO oniguruma C dep — so the workspace stays all-Rust and
# `forbid(unsafe_code)` in cyrup-tui is unaffected (the lint is per-crate, not transitive).
pulldown-cmark       = { version = "0.13.4", default-features = false }
syntect              = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
# `default-features = false` drops the `chafa-dyn` feature (a C `libchafa` pkg-config dep used only
# for higher-quality sixel encoding); sixel still works via the pure-Rust `icy_sixel`, so the
# workspace stays all-Rust with no system library. `crossterm` matches ratatui's backend.
ratatui-image        = { version = "11.0.6", default-features = false, features = ["crossterm"] }
# Bounded terminal-query I/O for cyrup-tui's OSC 11 / DSR `?996` background+color-scheme probes
# (Pi `tui.ts:1174-1220`). We must (a) wait for a reply with a HARD timeout and (b) consume ONLY the
# reply, never a byte of the user's typing — crossterm's event API cannot express either (it has no
# OSC/DSR event and its `poll` consumes into its own parser), so the probe needs `poll(2)` +
# `read(2)` directly. `rustix` is the pure-Rust, `unsafe`-free wrapper for exactly that: on Linux it
# is a `linux_raw` syscall backend with NO C dependency, keeping `#![forbid(unsafe_code)]` intact in
# cyrup-tui. Already in the graph transitively (tempfile/is-terminal); only `event` (poll) is enabled.
rustix               = { version = "1.1", default-features = false, features = ["std", "event"] }

# Additional standardized externals (arch-00 §7 / §7.1) are added to this table
# when first used, to avoid pinning versions ahead of need:
#   schemars, reqwest(rustls)+eventsource-stream, rustls, webpki-roots,
#   ratatui, crossterm, ratatui-image, unicode-width, unicode-segmentation, tui-textarea,
#   wasmtime(component-model,async,epoch,pooling-allocator), wasmtime-wasi, wit-bindgen,
#   ignore, globset, grep/grep-searcher/grep-regex, clap, tracing, tracing-subscriber,
#   time, uuid, fs4, oauth2, sha2, base64, parking_lot, dashmap,
#   arc-swap, indexmap, similar, image, smallvec, rustc-hash, directories, blake3,
#   toml, serde_yml, gix, notify, slotmap, pulldown-cmark, syntect, camino, bytes, memchr,
#   landlock, seccompiler.

# Dev-profile footprint control (ADR-0003 / arch-13 §6.2). Full DWARF (`debug=2`,
# the dev default) dominates target/debug/deps; line-tables-only keeps file:line in
# backtraces at a fraction of the size, and dependency crates carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false          # deps: no DWARF (we don't step into them) — R-ARCH-BLD-002/008

# Single static binary, lean + fast (arch-00 Appendix B / func-00 R-00-008).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"     # revisit vs "3" per arch-00 §12 benchmark
